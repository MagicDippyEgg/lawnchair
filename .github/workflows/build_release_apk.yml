name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - 10-alpha-2
      - master
      - main

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.3.4
        with:
          submodules: true
      - name: Set up Java 11
        uses: actions/setup-java@v1.4.3
        with:
          java-version: 11
      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x gradlew
      - name: Build release APK
        run: ./gradlew assembleAospWithQuickstepLawnchairRelease --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: Lawnchair-Release
          path: build/outputs/apk/aospWithQuickstepLawnchair/release/**.apk
