name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - 10-alpha-2

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'zulu'
      - name: Grant execution permission to Gradle Wrapper
        run: chmod +x gradlew
      - name: Build release APK
        run: ./gradlew assembleAospWithQuickstepLawnchairDevRelease --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lawnchair-Release
          path: build/outputs/apk/aospWithQuickstepLawnchairDev/release/**.apk
